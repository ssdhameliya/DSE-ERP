name: Finalize v10.0.14 recovery safeguards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v10.0.14-recovery.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply permanent workflow safeguards and remove recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text()
          count = text.count('retention-days: 7')
          if count != 4:
              raise SystemExit(f'Expected exactly 4 seven-day transport artifacts, found {count}')
          text = text.replace('retention-days: 7', 'retention-days: 1')
          text = text.replace("asset.get('url','')", "asset.get('downloadUrl','')")
          release.write_text(text)

          prod = Path('.github/workflows/deploy-prod.yml')
          prod_text = prod.read_text()
          prod_text = prod_text.replace("asset.get('url','')", "asset.get('downloadUrl','')")
          prod.write_text(prod_text)
          PY

          grep -c 'retention-days: 1' .github/workflows/release.yml | grep -qx '4'
          ! grep -q 'retention-days: 7' .github/workflows/release.yml
          ! grep -q "asset.get('url','')" .github/workflows/release.yml
          ! grep -q "asset.get('url','')" .github/workflows/deploy-prod.yml
          grep -q "asset.get('downloadUrl','')" .github/workflows/release.yml
          grep -q "asset.get('downloadUrl','')" .github/workflows/deploy-prod.yml

          rm -f .github/workflows/recover-v10.0.14.yml
          rm -f .github/workflows/recover-v10.0.14-prod.yml
          rm -f .github/workflows/finalize-v10.0.14-recovery.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml .github/workflows/deploy-prod.yml
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'ci: reduce release artifact retention and fix update gateway validation'
          git push origin HEAD:main
