name: Build 9.0.87 Handoff

on:
  push:
    branches:
      - handoff-9.0.87

permissions:
  contents: read

jobs:
  source-server:
    name: Source + Server JAR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^-Drevision=//p' .mvn/maven.config | head -1)" = "9.0.87"
          git fetch origin main --depth=1
          echo "MAIN_SHA=$(git rev-parse origin/main)"
      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp clean verify
      - name: Prepare handoff artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          ./mvnw -B -ntp -pl server -am package -DskipTests
          cp server/target/dse-erp-server.jar handoff/DSE-ERP-9.0.87-SERVER.jar
          git archive --format=zip --output=handoff/DSE-ERP-9.0.87-SOURCE.zip origin/main
          (
            cd handoff
            sha256sum DSE-ERP-9.0.87-SERVER.jar DSE-ERP-9.0.87-SOURCE.zip > checksums-handoff.sha256
          )
      - name: Upload source and server
        uses: actions/upload-artifact@v7
        with:
          name: dse-erp-9.0.87-source-server
          path: handoff/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { $wixBin = Join-Path $wix.FullName 'bin'; $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: |
          choco install postgresql18 --yes --no-progress --params '/NoPath /Password:DseReleaseBuildOnly!'
          $pg = 'C:\Program Files\PostgreSQL\18'
          if (-not (Test-Path (Join-Path $pg 'bin\initdb.exe'))) { throw "PostgreSQL 18 runtime not found at $pg" }
          "DSE_POSTGRES_RUNTIME_DIR=$pg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '9.0.87'
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: dse-erp-9.0.87-windows
          path: release-artifacts/windows/*
          if-no-files-found: error
          retention-days: 7
