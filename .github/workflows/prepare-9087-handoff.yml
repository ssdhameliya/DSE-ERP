name: Prepare 9.0.87 Handoff

on:
  push:
    branches:
      - release-9.0.87-safety-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v6
        with:
          ref: a3acb1bb23f5f07c27a0dfae1f4f94715bb6bf2c
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .mvn/maven.config)" = "-Drevision=9.0.87"
          ./mvnw -B -ntp -pl server -am package -DskipTests
      - name: Prepare source and server handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/source handoff/server
          rsync -a --exclude='.git' --exclude='target' --exclude='handoff' ./ handoff/source/DSE-ERP-9.0.87-IntelliJ/
          (cd handoff/source && zip -qr ../DSE-ERP-9.0.87-IntelliJ-Source.zip DSE-ERP-9.0.87-IntelliJ)
          cp server/target/dse-erp-server.jar handoff/server/DSE-ERP-9.0.87-SERVER.jar
          sha256sum handoff/server/DSE-ERP-9.0.87-SERVER.jar > handoff/server/DSE-ERP-9.0.87-SERVER.sha256
      - name: Upload IntelliJ source copy
        uses: actions/upload-artifact@v7
        with:
          name: DSE-ERP-9.0.87-IntelliJ-Source
          path: handoff/DSE-ERP-9.0.87-IntelliJ-Source.zip
          retention-days: 7
      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: DSE-ERP-9.0.87-SERVER
          path: handoff/server/*
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v6
        with:
          ref: a3acb1bb23f5f07c27a0dfae1f4f94715bb6bf2c
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify project
        shell: pwsh
        run: ./mvnw -B -ntp clean verify
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { $wixBin = Join-Path $wix.FullName 'bin'; $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: |
          choco install postgresql18 --yes --no-progress --params '/NoPath /Password:DseReleaseBuildOnly!'
          $pg = 'C:\Program Files\PostgreSQL\18'
          if (-not (Test-Path (Join-Path $pg 'bin\initdb.exe'))) { throw "PostgreSQL 18 runtime not found at $pg" }
          "DSE_POSTGRES_RUNTIME_DIR=$pg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '9.0.87'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: DSE-ERP-9.0.87-Windows-x64
          path: release-artifacts/windows/*
          retention-days: 7
