name: Stage release 10.0.15 source

on:
  push:
    branches:
      - release-10.0.15
    paths:
      - '.github/workflows/apply-release-10.0.15-staging.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply validated 10.0.15 source delta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply verified source delta
        shell: bash
        run: |
          set -euo pipefail
          # Repair the one staging transport character that changed during connector transfer.
          sed -i 's/Xcok6a/Xcok6i/' .release-staging/patch.part03
          cat .release-staging/patch.part* | base64 -d > /tmp/release.patch.xz
          echo 'd62245c0d8747ab7d63583bcc00b4afc78c58213912f016be7a46a513a32f037  /tmp/release.patch.xz' | sha256sum -c -
          xz -t /tmp/release.patch.xz
          xz -dc /tmp/release.patch.xz > /tmp/release.patch
          git apply --binary --index /tmp/release.patch
          rm -rf .release-staging
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: apply 10.0.15 validated source'
          git push origin HEAD:release-10.0.15
