name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'UAT-approved release tag (for example vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dse-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved release to PROD
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PROD_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      PROD_EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
      UAT_HEALTH_URL: ${{ vars.DSE_UAT_PUBLIC_HEALTH_URL }}
      UAT_EXPECTED_DATABASE: ${{ vars.DSE_UAT_EXPECTED_DATABASE }}
    steps:
      - name: Normalize release tag input
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          RAW='${{ inputs.tag }}'
          [[ "$RAW" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag must look like vX.Y.Z (uppercase V is accepted)' >&2; exit 1; }
          TAG="v${RAW:1}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Normalized PROD release tag: $RAW -> $TAG"

      - name: Checkout the approved release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.normalize.outputs.tag }}

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.normalize.outputs.tag }}'
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Normalized tag must look like vX.Y.Z' >&2; exit 1; }
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(sed -n 's/^-Drevision=//p' .mvn/maven.config | head -1)"
          [[ "$VERSION" == "$SOURCE_VERSION" ]] || { echo "Tag/source version mismatch: $VERSION vs $SOURCE_VERSION" >&2; exit 1; }
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS PROD_HEALTH_URL PROD_EXPECTED_DATABASE UAT_HEALTH_URL UAT_EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub production environment secret/variable: $name" >&2; exit 1; }
          done
          policy() {
            python3 - "$1" <<'PY'
          import sys,xml.etree.ElementTree as ET
          key=sys.argv[1]
          root=ET.parse('pom.xml').getroot()
          ns={'m':'http://maven.apache.org/POM/4.0.0'}
          node=root.find(f'm:properties/m:{key}',ns)
          print('' if node is None or node.text is None else node.text.strip())
          PY
          }
          COMPATIBILITY_BASELINE="$(policy desktop.compatibility.baseline)"
          ANDROID_MINIMUM="$(policy android.compatibility.baseline)"
          ANDROID_LATEST="$(policy android.latest.version)"
          IOS_MINIMUM="$(policy ios.compatibility.baseline)"
          IOS_LATEST="$(policy ios.latest.version)"
          for policy_version in "$COMPATIBILITY_BASELINE" "$ANDROID_MINIMUM" "$ANDROID_LATEST" "$IOS_MINIMUM" "$IOS_LATEST"; do
            [[ "$policy_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid compatibility version: $policy_version" >&2; exit 1; }
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "COMPATIBILITY_BASELINE=$COMPATIBILITY_BASELINE" >> "$GITHUB_ENV"
          echo "ANDROID_MINIMUM=$ANDROID_MINIMUM" >> "$GITHUB_ENV"
          echo "ANDROID_LATEST=$ANDROID_LATEST" >> "$GITHUB_ENV"
          echo "IOS_MINIMUM=$IOS_MINIMUM" >> "$GITHUB_ENV"
          echo "IOS_LATEST=$IOS_LATEST" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Verify the same version is currently healthy in UAT
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 15 "$UAT_HEALTH_URL")"
          python3 - "$VERSION" "$UAT_EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$ANDROID_MINIMUM" "$ANDROID_LATEST" "$IOS_MINIMUM" "$IOS_LATEST" "$BODY" <<'PY'
          import json,sys
          version,database,min_desktop,min_android,latest_android,min_ios,latest_ios,body=sys.argv[1:]
          r=json.loads(body)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='UAT' and r.get('databaseName')==database
              and r.get('minimumSupportedDesktopVersion')==min_desktop
              and r.get('latestDesktopVersion')==version
              and r.get('minimumSupportedAndroidVersion')==min_android
              and r.get('latestAndroidVersion')==latest_android
              and r.get('minimumSupportedIosVersion')==min_ios
              and r.get('latestIosVersion')==latest_ios)
          if not ok:
              raise SystemExit(f'UAT is not running the requested approved release: {r}')
          print(f'UAT_GATE_OK version={version} database={database} desktopMin={min_desktop} android={min_android}..{latest_android} ios={min_ios}..{latest_ios}')
          PY

      - name: Download exact GitHub release server artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          gh release download "$TAG" \
            --repo '${{ github.repository }}' \
            --pattern "DSE-ERP-${VERSION}-SERVER.jar" \
            --pattern 'checksums.txt' \
            --dir deploy-artifacts
          EXPECTED="$(awk -v f="DSE-ERP-${VERSION}-SERVER.jar" '$2==f {print $1}' deploy-artifacts/checksums.txt)"
          [[ -n "$EXPECTED" ]] || { echo 'Server checksum is missing from release checksums.txt' >&2; exit 1; }
          ACTUAL="$(sha256sum "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Release server checksum mismatch: $ACTUAL != $EXPECTED" >&2; exit 1; }
          echo "SERVER_SHA=$ACTUAL" >> "$GITHUB_ENV"
          echo "Exact UAT-approved release artifact verified: $ACTUAL"

      - name: Configure strict SSH host verification
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release and deployment script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"

      - name: Deploy PROD with automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh prod /tmp/dse-erp-ci-deploy/DSE-ERP-${VERSION}-SERVER.jar '${VERSION}' '${SERVER_SHA}' '${COMPATIBILITY_BASELINE}' '${ANDROID_MINIMUM}' '${ANDROID_LATEST}' '${IOS_MINIMUM}' '${IOS_LATEST}'" \
            | tee DSE-ERP-PROD-deploy.log

      - name: Verify public PROD HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PROD_HEALTH_URL")"
          python3 - "$VERSION" "$PROD_EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$ANDROID_MINIMUM" "$ANDROID_LATEST" "$IOS_MINIMUM" "$IOS_LATEST" "$BODY" <<'PY'
          import json,sys
          version,database,min_desktop,min_android,latest_android,min_ios,latest_ios,body=sys.argv[1:]
          r=json.loads(body)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='PROD' and r.get('databaseName')==database
              and r.get('minimumSupportedDesktopVersion')==min_desktop
              and r.get('latestDesktopVersion')==version
              and r.get('minimumSupportedAndroidVersion')==min_android
              and r.get('latestAndroidVersion')==latest_android
              and r.get('minimumSupportedIosVersion')==min_ios
              and r.get('latestIosVersion')==latest_ios)
          if not ok:
              raise SystemExit(f'Public PROD health validation failed: {r}')
          print(f'PROD_DEPLOYMENT_OK version={version} database={database} desktopMin={min_desktop} android={min_android}..{latest_android} ios={min_ios}..{latest_ios}')
          PY

      - name: Promote approved GitHub release to STABLE
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo '${{ github.repository }}' --prerelease=false
          PRERELEASE="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.prerelease')"
          [[ "$PRERELEASE" == "false" ]] || { echo "GitHub release $TAG was not promoted to STABLE" >&2; exit 1; }
          echo "RELEASE_PROMOTED_TO_STABLE tag=$TAG"

      - name: Clean remote upload staging
        if: always() && steps.ssh.outcome == 'success'
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -rf /tmp/dse-erp-ci-deploy' || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-deployment-${{ steps.normalize.outputs.tag }}
          path: DSE-ERP-PROD-deploy.log
          if-no-files-found: ignore
          retention-days: 30
