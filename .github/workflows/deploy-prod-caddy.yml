name: Configure PROD Web Proxy (Caddy)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dse-erp-prod-caddy-config
  cancel-in-progress: false

jobs:
  configure-caddy:
    name: Configure PROD Caddy for Pure Java Web UI
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate connection secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS PUBLIC_HEALTH_URL; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub production environment secret/variable: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure strict SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify PROD Server Health Before Proxy Change
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL" | grep -q '"ready":true'
          echo "PROD_SERVER_HEALTH_VERIFIED"

      - name: Upload and Execute Caddy Configuration Script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            scripts/linux/configure-caddy-prod.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'bash /tmp/dse-erp-ci-deploy/configure-caddy-prod.sh'

      - name: Clean Remote Staging
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -rf /tmp/dse-erp-ci-deploy' || true

      - name: Verify Public PROD Pure Java Web UI
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying erp.jasviindustries.in reaches Vaadin Flow web application..."
          curl --fail --silent --show-error --max-time 20 -IL https://erp.jasviindustries.in/login | tee web-verify.log
          grep -qi 'nosniff\|Set-Cookie\|vaadin' web-verify.log || {
            echo "Response did not originate from Spring Boot application" >&2
            exit 1
          }
          echo "PROD_VAADIN_WEB_ROUTING_VERIFIED_OK"
