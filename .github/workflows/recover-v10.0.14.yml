name: Recover v10.0.14 without Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-v10.0.14.yml'

permissions:
  contents: write

concurrency:
  group: recover-v10.0.14
  cancel-in-progress: false

env:
  TAG: v10.0.14
  VERSION: 10.0.14
  RELEASE_COMMIT: 1745fbdf8f50b1fc9740ee81a5ff4fa51d5cfe41

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
          fetch-depth: 0
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          [[ "$ACTUAL" == "$RELEASE_COMMIT" ]] || { echo "Unexpected v10.0.14 commit: $ACTUAL" >&2; exit 1; }
          SOURCE_VERSION="$(sed -n 's/^-Drevision=//p' .mvn/maven.config | head -1)"
          [[ "$SOURCE_VERSION" == "$VERSION" ]] || { echo "Version mismatch: $SOURCE_VERSION" >&2; exit 1; }
          python3 scripts/audit-release-gates.py
      - name: Create prerelease directly from existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $TAG"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSE ERP $VERSION" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi

  server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and publish canonical server JAR directly to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -ntp -pl server -am package -DskipTests
          mkdir -p direct-release
          JAR="direct-release/DSE-ERP-${VERSION}-SERVER.jar"
          cp server/target/dse-erp-server.jar "$JAR"
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "SERVER_RELEASE_SHA256=$SHA"
          gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: server
    runs-on: windows-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build desktop artifacts
        shell: pwsh
        run: |
          ./mvnw -B -ntp -pl desktop -am package -DskipTests
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Download canonical server JAR from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path 'native-server' -Force | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "DSE-ERP-$env:VERSION-SERVER.jar" --dir native-server
          if ($LASTEXITCODE -ne 0) { throw 'Server release download failed' }
          New-Item -ItemType Directory -Path 'server/target' -Force | Out-Null
          Copy-Item -LiteralPath "native-server/DSE-ERP-$env:VERSION-SERVER.jar" -Destination 'server/target/dse-erp-server.jar' -Force
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { (Join-Path $wix.FullName 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Restore PostgreSQL 18 runtime cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\dse-postgresql-18-runtime
          key: dse-postgresql-windows-${{ runner.arch }}-18-${{ hashFiles('scripts/ci/prepare-postgresql-windows.ps1') }}
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: ./scripts/ci/prepare-postgresql-windows.ps1
      - name: Build and publish Windows package directly to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/package-windows.ps1 -Version $env:VERSION -Preverified
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          gh release upload $env:TAG "release-artifacts/windows/DSE-ERP-$env:VERSION-Windows-x64.exe" "release-artifacts/windows/checksums-windows.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release upload failed' }

  macos-arm64:
    needs: server
    runs-on: macos-15
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
          cache: maven
      - name: Build desktop artifacts
        shell: zsh {0}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl desktop -am package -DskipTests
      - name: Download canonical server JAR from GitHub Release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-server server/target
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "DSE-ERP-${VERSION}-SERVER.jar" --dir native-server
          cp "native-server/DSE-ERP-${VERSION}-SERVER.jar" server/target/dse-erp-server.jar
      - name: Restore PostgreSQL 18 runtime cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dse-postgresql-18.4
          key: dse-postgresql-macos-${{ runner.arch }}-18.4-${{ hashFiles('scripts/build-postgresql-macos.sh', 'scripts/ci/prepare-postgresql-macos.sh') }}
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: zsh ./scripts/ci/prepare-postgresql-macos.sh
      - name: Build and publish Apple Silicon DMG directly to Release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSE_POSTGRES_RUNTIME_DIR: ${{ runner.temp }}/dse-postgresql-18.4
        run: |
          set -euo pipefail
          zsh ./scripts/package-macos.sh "$VERSION" --preverified
          DMG="target/macos-installer/DSE-ERP-${VERSION}-macOS-arm64.dmg"
          [[ -s "$DMG" ]] || { echo "Missing Apple Silicon DMG: $DMG" >&2; exit 1; }
          gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber

  macos-intel:
    needs: server
    runs-on: macos-15-intel
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven
      - name: Build desktop artifacts
        shell: zsh {0}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl desktop -am package -DskipTests
      - name: Download canonical server JAR from GitHub Release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-server server/target
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "DSE-ERP-${VERSION}-SERVER.jar" --dir native-server
          cp "native-server/DSE-ERP-${VERSION}-SERVER.jar" server/target/dse-erp-server.jar
      - name: Restore PostgreSQL 18 runtime cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dse-postgresql-18.4
          key: dse-postgresql-macos-${{ runner.arch }}-18.4-${{ hashFiles('scripts/build-postgresql-macos.sh', 'scripts/ci/prepare-postgresql-macos.sh') }}
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: zsh ./scripts/ci/prepare-postgresql-macos.sh
      - name: Build and publish Intel DMG directly to Release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSE_POSTGRES_RUNTIME_DIR: ${{ runner.temp }}/dse-postgresql-18.4
        run: |
          set -euo pipefail
          zsh ./scripts/package-macos.sh "$VERSION" --preverified
          DMG="target/macos-installer/DSE-ERP-${VERSION}-macOS-x86_64.dmg"
          [[ -s "$DMG" ]] || { echo "Missing Intel DMG: $DMG" >&2; exit 1; }
          gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber

  finalize-release:
    needs: [server, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Generate combined checksums from published Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          cd published
          for required in \
            "DSE-ERP-${VERSION}-SERVER.jar" \
            "DSE-ERP-${VERSION}-Windows-x64.exe" \
            "DSE-ERP-${VERSION}-macOS-arm64.dmg" \
            "DSE-ERP-${VERSION}-macOS-x86_64.dmg" \
            "checksums-windows.sha256"; do
            [[ -s "$required" ]] || { echo "Missing required release asset: $required" >&2; exit 1; }
          done
          sha256sum DSE-ERP-* > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify complete prerelease asset set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            "DSE-ERP-${VERSION}-SERVER.jar" \
            "DSE-ERP-${VERSION}-Windows-x64.exe" \
            "DSE-ERP-${VERSION}-macOS-arm64.dmg" \
            "DSE-ERP-${VERSION}-macOS-x86_64.dmg" \
            "checksums-windows.sha256" \
            "checksums.txt"; do
            grep -Fxq "$required" <<<"$ASSETS" || { echo "Release asset not found: $required" >&2; exit 1; }
          done
          echo "DIRECT_RELEASE_ASSETS_OK tag=$TAG"

  deploy-uat:
    name: Recover 10.0.14 to UAT
    needs: finalize-release
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 25
    env:
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      DSE_GITHUB_UPDATE_TOKEN: ${{ secrets.DSE_GITHUB_UPDATE_TOKEN }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Resolve release compatibility policy
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DSE_GITHUB_UPDATE_TOKEN PUBLIC_HEALTH_URL EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing UAT configuration: $name" >&2; exit 1; }
          done
          policy() { python3 - "$1" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse('pom.xml').getroot(); ns={'m':'http://maven.apache.org/POM/4.0.0'}
          node=root.find(f'm:properties/m:{sys.argv[1]}',ns)
          print('' if node is None or node.text is None else node.text.strip())
          PY
          }
          echo "COMPATIBILITY_BASELINE=$(policy desktop.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "ANDROID_MINIMUM=$(policy android.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "ANDROID_LATEST=$(policy android.latest.version)" >> "$GITHUB_ENV"
          echo "IOS_MINIMUM=$(policy ios.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "IOS_LATEST=$(policy ios.latest.version)" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
      - name: Download and verify published server artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "DSE-ERP-${VERSION}-SERVER.jar" --pattern checksums.txt --dir deploy-artifacts
          EXPECTED="$(awk -v f="DSE-ERP-${VERSION}-SERVER.jar" '$2==f {print $1}' deploy-artifacts/checksums.txt)"
          ACTUAL="$(sha256sum "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" | awk '{print $1}')"
          [[ -n "$EXPECTED" && "$ACTUAL" == "$EXPECTED" ]] || { echo "Server checksum mismatch: $ACTUAL != $EXPECTED" >&2; exit 1; }
          echo "SERVER_SHA=$ACTUAL" >> "$GITHUB_ENV"
      - name: Configure SSH and upload release
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            scripts/linux/configure-github-update-token.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"
      - name: Configure UAT private GitHub token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DSE_GITHUB_UPDATE_TOKEN" | ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash /tmp/dse-erp-ci-deploy/configure-github-update-token.sh uat'
      - name: Deploy UAT
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh uat /tmp/dse-erp-ci-deploy/DSE-ERP-${VERSION}-SERVER.jar '${VERSION}' '${SERVER_SHA}' '${COMPATIBILITY_BASELINE}' '${ANDROID_MINIMUM}' '${ANDROID_LATEST}' '${IOS_MINIMUM}' '${IOS_LATEST}'"
      - name: Verify UAT health and private update gateway
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - "$VERSION" "$EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$HEALTH" <<'PY'
          import json,sys
          version,database,baseline,body=sys.argv[1:]
          r=json.loads(body)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version and r.get('environment')=='UAT' and r.get('databaseName')==database and r.get('minimumSupportedDesktopVersion')==baseline and r.get('latestDesktopVersion')==version)
          if not ok: raise SystemExit(f'UAT health validation failed: {r}')
          print(f'UAT_DEPLOYMENT_OK version={version} database={database}')
          PY
          UPDATE_URL="${PUBLIC_HEALTH_URL%/api/runtime/health}/api/updates/releases/latest?includePrerelease=true"
          UPDATE="$(curl --fail --silent --show-error --max-time 30 "$UPDATE_URL")"
          python3 - "$VERSION" "$UPDATE" <<'PY'
          import json,sys
          version,body=sys.argv[1:]; r=json.loads(body)
          tag=str(r.get('tagName','')).lstrip('vV'); assets=r.get('assets')
          if tag != version or not isinstance(assets,list) or not assets: raise SystemExit(f'UAT update gateway validation failed: {r}')
          if any(not str(a.get('url','')).startswith('/api/updates/assets/') for a in assets): raise SystemExit(f'Unexpected UAT asset URL: {r}')
          print(f'UAT_PRIVATE_UPDATE_GATEWAY_OK version={version} assets={len(assets)}')
          PY
      - name: Clean UAT staging
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/dse-erp-ci-deploy' || true

  deploy-prod:
    name: Recover 10.0.14 to PROD
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    concurrency:
      group: dse-erp-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      DSE_GITHUB_UPDATE_TOKEN: ${{ secrets.DSE_GITHUB_UPDATE_TOKEN }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PROD_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      PROD_EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
      UAT_HEALTH_URL: ${{ vars.DSE_UAT_PUBLIC_HEALTH_URL }}
      UAT_EXPECTED_DATABASE: ${{ vars.DSE_UAT_EXPECTED_DATABASE }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: v10.0.14
      - name: Resolve and validate deployment policy
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DSE_GITHUB_UPDATE_TOKEN PROD_HEALTH_URL PROD_EXPECTED_DATABASE UAT_HEALTH_URL UAT_EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing PROD configuration: $name" >&2; exit 1; }
          done
          policy() { python3 - "$1" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse('pom.xml').getroot(); ns={'m':'http://maven.apache.org/POM/4.0.0'}
          node=root.find(f'm:properties/m:{sys.argv[1]}',ns)
          print('' if node is None or node.text is None else node.text.strip())
          PY
          }
          echo "COMPATIBILITY_BASELINE=$(policy desktop.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "ANDROID_MINIMUM=$(policy android.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "ANDROID_LATEST=$(policy android.latest.version)" >> "$GITHUB_ENV"
          echo "IOS_MINIMUM=$(policy ios.compatibility.baseline)" >> "$GITHUB_ENV"
          echo "IOS_LATEST=$(policy ios.latest.version)" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
      - name: Verify UAT is running 10.0.14
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$UAT_HEALTH_URL")"
          python3 - "$VERSION" "$UAT_EXPECTED_DATABASE" "$BODY" <<'PY'
          import json,sys
          version,database,body=sys.argv[1:]; r=json.loads(body)
          if not (r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version and r.get('environment')=='UAT' and r.get('databaseName')==database): raise SystemExit(f'UAT gate failed: {r}')
          print(f'UAT_GATE_OK version={version} database={database}')
          PY
      - name: Download and verify exact GitHub Release server artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "DSE-ERP-${VERSION}-SERVER.jar" --pattern checksums.txt --dir deploy-artifacts
          EXPECTED="$(awk -v f="DSE-ERP-${VERSION}-SERVER.jar" '$2==f {print $1}' deploy-artifacts/checksums.txt)"
          ACTUAL="$(sha256sum "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" | awk '{print $1}')"
          [[ -n "$EXPECTED" && "$ACTUAL" == "$EXPECTED" ]] || { echo "PROD release checksum mismatch: $ACTUAL != $EXPECTED" >&2; exit 1; }
          echo "SERVER_SHA=$ACTUAL" >> "$GITHUB_ENV"
      - name: Configure SSH and upload release
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            scripts/linux/configure-github-update-token.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"
      - name: Configure PROD private GitHub token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DSE_GITHUB_UPDATE_TOKEN" | ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash /tmp/dse-erp-ci-deploy/configure-github-update-token.sh prod'
      - name: Deploy PROD with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh prod /tmp/dse-erp-ci-deploy/DSE-ERP-${VERSION}-SERVER.jar '${VERSION}' '${SERVER_SHA}' '${COMPATIBILITY_BASELINE}' '${ANDROID_MINIMUM}' '${ANDROID_LATEST}' '${IOS_MINIMUM}' '${IOS_LATEST}'"
      - name: Verify PROD health and private update gateway
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$PROD_HEALTH_URL")"
          python3 - "$VERSION" "$PROD_EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$HEALTH" <<'PY'
          import json,sys
          version,database,baseline,body=sys.argv[1:]; r=json.loads(body)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version and r.get('environment')=='PROD' and r.get('databaseName')==database and r.get('minimumSupportedDesktopVersion')==baseline and r.get('latestDesktopVersion')==version)
          if not ok: raise SystemExit(f'PROD health validation failed: {r}')
          print(f'PROD_DEPLOYMENT_OK version={version} database={database}')
          PY
          UPDATE_URL="${PROD_HEALTH_URL%/api/runtime/health}/api/updates/releases/latest?includePrerelease=true"
          UPDATE="$(curl --fail --silent --show-error --max-time 30 "$UPDATE_URL")"
          python3 - "$VERSION" "$UPDATE" <<'PY'
          import json,sys
          version,body=sys.argv[1:]; r=json.loads(body)
          tag=str(r.get('tagName','')).lstrip('vV'); assets=r.get('assets')
          if tag != version or not isinstance(assets,list) or not assets: raise SystemExit(f'PROD update gateway validation failed: {r}')
          if any(not str(a.get('url','')).startswith('/api/updates/assets/') for a in assets): raise SystemExit(f'Unexpected PROD asset URL: {r}')
          print(f'PROD_PRIVATE_UPDATE_GATEWAY_OK version={version} assets={len(assets)}')
          PY
      - name: Promote verified 10.0.14 Release to stable
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
          STATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq '.prerelease')"
          [[ "$STATE" == "false" ]] || { echo "Release was not promoted to stable" >&2; exit 1; }
          echo "RELEASE_PROMOTED_TO_STABLE tag=$TAG"
      - name: Clean PROD staging
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/dse-erp-ci-deploy' || true
