name: Build Native Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tail -1)"
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tail -1)"
          if [[ "$VERSION" != "$POM_VERSION" ]]; then
            echo "Tag version $VERSION does not match pom.xml version $POM_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Enforce no new desktop JDBC debt
        run: python3 scripts/audit-desktop-jdbc.py
      - name: Enforce Phase 2 desktop data boundary
        run: python3 scripts/audit-phase2-data-boundary.py
      - name: Enforce PostgreSQL-only desktop runtime
        run: python3 scripts/audit-postgres-only.py
      - name: Enforce final Spring/Hibernate data architecture
        run: python3 scripts/audit-final-data-architecture.py
      - name: Enforce auth, shortcut and recon UI contract
        run: python3 scripts/audit-auth-shortcut-ui-contract.py
      - name: Enforce global register and dialog UI contract
        run: python3 scripts/audit-global-ui-contract.py
      - name: Enforce 9.0.3 import and history contract
        run: python3 scripts/audit-9.0.3-import-contract.py
      - name: Enforce 9.0.4 Bank reconciliation contract
        run: python3 scripts/audit-9.0.4-bank-reconciliation-contract.py
      - name: Enforce 9.0.5 reconciliation/navigation UI contract
        run: python3 scripts/audit-9.0.5-reconciliation-navigation-ui-contract.py
      - name: Enforce 9.0.6 business-integrity contract
        run: python3 scripts/audit-9.0.6-business-integrity-contract.py
      - name: Enforce 9.0.8 PDF Studio safety contract
        run: python3 scripts/audit-9.0.8-pdf-studio-contract.py
      - name: Enforce 9.0.11 consolidated corrective contract
        run: python3 scripts/audit-9.0.11-corrective-contract.py
      - name: Enforce 9.0.12 Sales/payment compatibility contract
        run: python3 scripts/audit-9.0.12-sales-payment-compatibility.py
      - name: Enforce 9.0.13 register/KPI/login/history contract
        run: python3 scripts/audit-9.0.13-register-login-history-contract.py
      - name: Enforce 9.0.14 quotation/register contract
        run: python3 scripts/audit-9.0.14-quotation-register-contract.py
      - name: Enforce 9.0.15 reference/item/import/quotation-source contract
        run: python3 scripts/audit-9.0.15-reference-item-import-contract.py
      - name: Enforce 9.0.16 quotation-source / linked-sale contract
        run: python3 scripts/audit-9.0.16-quotation-source-sale-link-contract.py
      - name: Run tests
        run: mvn -B -ntp clean verify

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify project on Windows
        shell: pwsh
        run: mvn -B -ntp clean verify
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { $wixBin = Join-Path $wix.FullName 'bin'; $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: |
          choco install postgresql18 --yes --no-progress --params '/NoPath /Password:DseReleaseBuildOnly!'
          $pg = 'C:\Program Files\PostgreSQL\18'
          if (-not (Test-Path (Join-Path $pg 'bin\initdb.exe'))) { throw "PostgreSQL 18 runtime not found at $pg" }
          "DSE_POSTGRES_RUNTIME_DIR=$pg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ needs.validate.outputs.version }}'
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release-artifacts/windows/*
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
          cache: maven
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: |
          PG_RUNTIME="$RUNNER_TEMP/dse-postgresql-18.4"
          zsh ./scripts/build-postgresql-macos.sh "$PG_RUNTIME"
          echo "DSE_POSTGRES_RUNTIME_DIR=$PG_RUNTIME" >> "$GITHUB_ENV"
      - name: Validate macOS packaging script
        shell: zsh {0}
        run: zsh -n ./scripts/package-macos.sh
      - name: Verify project on macOS
        shell: zsh {0}
        run: mvn -B -ntp clean verify
      - name: Build macOS Apple Silicon DMG
        shell: zsh {0}
        run: zsh ./scripts/package-macos.sh '${{ needs.validate.outputs.version }}'
      - name: Upload macOS Apple Silicon package
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: target/macos-installer/*
          if-no-files-found: error
          retention-days: 7

  macos-intel:
    needs: validate
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: |
          PG_RUNTIME="$RUNNER_TEMP/dse-postgresql-18.4"
          zsh ./scripts/build-postgresql-macos.sh "$PG_RUNTIME"
          echo "DSE_POSTGRES_RUNTIME_DIR=$PG_RUNTIME" >> "$GITHUB_ENV"
      - name: Validate macOS packaging script
        shell: zsh {0}
        run: zsh -n ./scripts/package-macos.sh
      - name: Verify project on macOS
        shell: zsh {0}
        run: mvn -B -ntp clean verify
      - name: Build macOS Intel DMG
        shell: zsh {0}
        run: zsh ./scripts/package-macos.sh '${{ needs.validate.outputs.version }}'
      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel
          path: target/macos-installer/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          rm -f checksums*.txt
          sha256sum DSE-ERP-* > checksums.txt
          ls -lah
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ needs.validate.outputs.tag }}' artifacts/* \
            --repo '${{ github.repository }}' \
            --title 'DSE ERP ${{ needs.validate.outputs.version }}' \
            --generate-notes \
            --verify-tag
