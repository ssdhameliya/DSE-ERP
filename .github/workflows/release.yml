name: Build Native Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      compatibility_baseline: ${{ steps.version.outputs.compatibility_baseline }}
      android_minimum: ${{ steps.version.outputs.android_minimum }}
      android_latest: ${{ steps.version.outputs.android_latest }}
      ios_minimum: ${{ steps.version.outputs.ios_minimum }}
      ios_latest: ${{ steps.version.outputs.ios_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the tag to point at the current green main commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          [[ "$TAG_COMMIT" == "$MAIN_COMMIT" ]] || {
            echo "Release tag must point at current origin/main: tag=$TAG_COMMIT main=$MAIN_COMMIT" >&2
            exit 1
          }

          for attempt in $(seq 1 30); do
            RESULT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TAG_COMMIT}&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Build and Test")] | sort_by(.created_at) | last | if . == null then "" else [.status,.conclusion] | @tsv end' 2>/dev/null || true)"
            STATUS="${RESULT%%$'\t'*}"
            CONCLUSION=""
            if [[ "$RESULT" == *$'\t'* ]]; then CONCLUSION="${RESULT#*$'\t'}"; fi
            if [[ "$STATUS" == "completed" && "$CONCLUSION" == "success" ]]; then
              echo "MAIN_CI_REUSED_OK commit=$TAG_COMMIT"
              break
            fi
            if [[ "$STATUS" == "completed" && -n "$CONCLUSION" && "$CONCLUSION" != "success" ]]; then
              echo "Build and Test for $TAG_COMMIT completed with conclusion=$CONCLUSION" >&2
              exit 1
            fi
            if (( attempt == 30 )); then
              echo "Timed out waiting for successful Build and Test on current main commit $TAG_COMMIT" >&2
              exit 1
            fi
            echo "Waiting for current-main Build and Test result (attempt ${attempt}/30)..."
            sleep 10
          done
      - name: Resolve release version and compatibility policy without Maven startup
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must look like vX.Y.Z: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(sed -n 's/^-Drevision=//p' .mvn/maven.config | head -1)"
          [[ "$VERSION" == "$SOURCE_VERSION" ]] || { echo "Tag/source version mismatch: $VERSION vs $SOURCE_VERSION" >&2; exit 1; }
          policy() {
            python3 - "$1" <<'PY'
          import sys,xml.etree.ElementTree as ET
          key=sys.argv[1]
          root=ET.parse('pom.xml').getroot()
          ns={'m':'http://maven.apache.org/POM/4.0.0'}
          node=root.find(f'm:properties/m:{key}',ns)
          print('' if node is None or node.text is None else node.text.strip())
          PY
          }
          COMPATIBILITY_BASELINE="$(policy desktop.compatibility.baseline)"
          ANDROID_MINIMUM="$(policy android.compatibility.baseline)"
          ANDROID_LATEST="$(policy android.latest.version)"
          IOS_MINIMUM="$(policy ios.compatibility.baseline)"
          IOS_LATEST="$(policy ios.latest.version)"
          for policy_version in "$COMPATIBILITY_BASELINE" "$ANDROID_MINIMUM" "$ANDROID_LATEST" "$IOS_MINIMUM" "$IOS_LATEST"; do
            [[ "$policy_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid compatibility version: $policy_version" >&2; exit 1; }
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "compatibility_baseline=$COMPATIBILITY_BASELINE" >> "$GITHUB_OUTPUT"
          echo "android_minimum=$ANDROID_MINIMUM" >> "$GITHUB_OUTPUT"
          echo "android_latest=$ANDROID_LATEST" >> "$GITHUB_OUTPUT"
          echo "ios_minimum=$IOS_MINIMUM" >> "$GITHUB_OUTPUT"
          echo "ios_latest=$IOS_LATEST" >> "$GITHUB_OUTPUT"
      - name: Enforce current release contracts
        run: python3 scripts/audit-release-gates.py

  tests:
    name: Validate tagged source (Linux)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests
        run: ./mvnw -B -ntp clean verify


  prepare-release:
    name: Create GitHub prerelease
    needs: [validate, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Create empty prerelease for direct binary uploads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ needs.validate.outputs.tag }}'
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it as the upload target."
          else
            gh release create "$TAG" \
              --repo '${{ github.repository }}' \
              --title 'DSE ERP ${{ needs.validate.outputs.version }}' \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
          PRERELEASE="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.prerelease')"
          [[ "$PRERELEASE" == "true" ]] || { echo "Release $TAG must remain prerelease until PROD verification" >&2; exit 1; }
          echo "PRERELEASE_READY tag=$TAG"

  server:
    needs: [validate, tests, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build canonical server artifact
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl server -am package -DskipTests
          mkdir -p release-artifacts/server
          cp server/target/dse-erp-server.jar "release-artifacts/server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
          sha256sum "release-artifacts/server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
      - name: Upload canonical server directly to GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="release-artifacts/server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
          gh release upload '${{ needs.validate.outputs.tag }}' "$JAR" \
            --repo '${{ github.repository }}' --clobber
          echo "SERVER_RELEASE_UPLOAD_OK file=$(basename "$JAR")"

  windows:
    needs: [validate, tests, prepare-release, server]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build platform-specific desktop artifacts without rerunning tests
        shell: pwsh
        run: ./mvnw -B -ntp -pl desktop -am package -DskipTests
      - name: Download canonical server from GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path 'native-server' -Force | Out-Null
          gh release download '${{ needs.validate.outputs.tag }}' --repo '${{ github.repository }}' --pattern 'DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar' --dir native-server
          if (-not (Test-Path 'native-server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar')) { throw 'Canonical server release asset was not downloaded' }
      - name: Use canonical server artifact in the Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'server/target' -Force | Out-Null
          Copy-Item -LiteralPath 'native-server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar' -Destination 'server/target/dse-erp-server.jar' -Force
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { $wixBin = Join-Path $wix.FullName 'bin'; $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Restore PostgreSQL 18 runtime cache
        id: postgres-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\dse-postgresql-18-runtime
          key: dse-postgresql-windows-${{ runner.arch }}-18-${{ hashFiles('scripts/ci/prepare-postgresql-windows.ps1') }}
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: ./scripts/ci/prepare-postgresql-windows.ps1
      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ needs.validate.outputs.version }}' -Preverified
      - name: Upload Windows package directly to GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Asset = Get-Item 'release-artifacts/windows/DSE-ERP-${{ needs.validate.outputs.version }}-Windows-x64.exe'
          gh release upload '${{ needs.validate.outputs.tag }}' $Asset.FullName --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows release upload failed' }
          Write-Host "WINDOWS_RELEASE_UPLOAD_OK file=$($Asset.Name)"

  macos-arm64:
    needs: [validate, tests, prepare-release, server]
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
          cache: maven
      - name: Build platform-specific desktop artifacts without rerunning tests
        shell: zsh {0}
        run: ./mvnw -B -ntp -pl desktop -am package -DskipTests
      - name: Download canonical server from GitHub prerelease
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-server
          gh release download '${{ needs.validate.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --pattern 'DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar' \
            --dir native-server
          test -s 'native-server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar'
      - name: Use canonical server artifact in the macOS installer
        shell: zsh {0}
        run: |
          mkdir -p server/target
          cp 'native-server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar' server/target/dse-erp-server.jar
      - name: Restore PostgreSQL 18 runtime cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dse-postgresql-18.4
          key: dse-postgresql-macos-${{ runner.arch }}-18.4-${{ hashFiles('scripts/build-postgresql-macos.sh', 'scripts/ci/prepare-postgresql-macos.sh') }}
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: zsh ./scripts/ci/prepare-postgresql-macos.sh
      - name: Validate macOS packaging script
        shell: zsh {0}
        run: zsh -n ./scripts/package-macos.sh
      - name: Build macOS Apple Silicon DMG
        shell: zsh {0}
        run: zsh ./scripts/package-macos.sh '${{ needs.validate.outputs.version }}' --preverified
      - name: Upload macOS Apple Silicon package directly to GitHub prerelease
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG='target/macos-installer/DSE-ERP-${{ needs.validate.outputs.version }}-macOS-arm64.dmg'
          test -s "$DMG"
          gh release upload '${{ needs.validate.outputs.tag }}' "$DMG" \
            --repo '${{ github.repository }}' --clobber
          echo "MACOS_ARM64_RELEASE_UPLOAD_OK file=$(basename "$DMG")"

  release:
    name: Finalize prerelease checksums
    needs: [validate, tests, prepare-release, server, windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download exact release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG='${{ needs.validate.outputs.tag }}'
          VERSION='${{ needs.validate.outputs.version }}'
          for asset in \
            "DSE-ERP-${VERSION}-SERVER.jar" \
            "DSE-ERP-${VERSION}-Windows-x64.exe" \
            "DSE-ERP-${VERSION}-macOS-arm64.dmg"; do
            gh release download "$TAG" --repo '${{ github.repository }}' --pattern "$asset" --dir release-assets
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          [[ "$(find release-assets -maxdepth 1 -type f -name 'DSE-ERP-*' | wc -l | tr -d ' ')" == "3" ]] || { echo 'Expected exactly three binary release assets' >&2; exit 1; }
      - name: Create and publish combined checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum DSE-ERP-* | sort -k2 > checksums.txt
          cat checksums.txt
          gh release upload '${{ needs.validate.outputs.tag }}' checksums.txt \
            --repo '${{ github.repository }}' --clobber
          echo 'RELEASE_CHECKSUMS_OK assets=3'
      - name: Verify prerelease asset contract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ needs.validate.outputs.tag }}'
          VERSION='${{ needs.validate.outputs.version }}'
          mapfile -t NAMES < <(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[].name' | sort)
          printf '%s\n' "${NAMES[@]}"
          for expected in \
            "DSE-ERP-${VERSION}-SERVER.jar" \
            "DSE-ERP-${VERSION}-Windows-x64.exe" \
            "DSE-ERP-${VERSION}-macOS-arm64.dmg" \
            "checksums.txt"; do
            printf '%s\n' "${NAMES[@]}" | grep -Fxq "$expected" || { echo "Missing published asset: $expected" >&2; exit 1; }
          done
          if printf '%s\n' "${NAMES[@]}" | grep -Eqi 'x86_64|intel|macos-intel'; then
            echo 'Intel macOS asset must not be published' >&2
            exit 1
          fi
          echo "RELEASE_ASSET_CONTRACT_OK version=$VERSION"


  deploy-uat:
    name: Auto-deploy release to UAT
    if: github.repository == 'ssdhameliya/DSE-ERP'
    needs: [validate, server, release]
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      DSE_GITHUB_UPDATE_TOKEN: ${{ secrets.DSE_GITHUB_UPDATE_TOKEN }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate UAT deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DSE_GITHUB_UPDATE_TOKEN PUBLIC_HEALTH_URL EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub uat environment secret/variable: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
      - name: Download and verify exact GitHub release server artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          VERSION='${{ needs.validate.outputs.version }}'
          TAG='${{ needs.validate.outputs.tag }}'
          gh release download "$TAG" --repo '${{ github.repository }}' \
            --pattern "DSE-ERP-${VERSION}-SERVER.jar" \
            --pattern 'checksums.txt' \
            --dir deploy-artifacts
          JAR="deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar"
          EXPECTED="$(awk -v f="DSE-ERP-${VERSION}-SERVER.jar" '$2==f {print $1}' deploy-artifacts/checksums.txt)"
          [[ -n "$EXPECTED" ]] || { echo 'Server checksum is missing from release checksums.txt' >&2; exit 1; }
          ACTUAL="$(sha256sum "$JAR" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Release server checksum mismatch: $ACTUAL != $EXPECTED" >&2; exit 1; }
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "UAT_RELEASE_ARTIFACT_MATCH_OK sha=$ACTUAL"
      - name: Configure strict SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release and deployment script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            scripts/linux/configure-github-update-token.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"
      - name: Configure UAT private GitHub update token
        shell: bash
        run: |
          set -euo pipefail
          # Stream the protected GitHub Environment secret over SSH stdin.
          # It never appears in command arguments, repository files or logs.
          printf '%s\n' "$DSE_GITHUB_UPDATE_TOKEN" | \
            ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              'bash /tmp/dse-erp-ci-deploy/configure-github-update-token.sh uat'
      - name: Deploy UAT with automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh uat /tmp/dse-erp-ci-deploy/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar '${{ needs.validate.outputs.version }}' '${{ steps.artifact.outputs.sha }}' '${{ needs.validate.outputs.compatibility_baseline }}' '${{ needs.validate.outputs.android_minimum }}' '${{ needs.validate.outputs.android_latest }}' '${{ needs.validate.outputs.ios_minimum }}' '${{ needs.validate.outputs.ios_latest }}'" \
            | tee DSE-ERP-UAT-deploy.log
      - name: Verify public UAT HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - '${{ needs.validate.outputs.version }}' "$EXPECTED_DATABASE" '${{ needs.validate.outputs.compatibility_baseline }}' "$BODY" <<'PY'
          import json,re,sys
          version,database,min_desktop,body=sys.argv[1:]
          r=json.loads(body)
          semver=re.compile(r'^\d+\.\d+\.\d+$')
          def valid_mobile_policy(min_key, latest_key):
              minimum=r.get(min_key); latest=r.get(latest_key)
              if not isinstance(minimum,str) or not isinstance(latest,str): return False
              if not semver.fullmatch(minimum) or not semver.fullmatch(latest): return False
              parse=lambda x: tuple(map(int,x.split('.')))
              return parse(minimum) <= parse(latest)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='UAT' and r.get('databaseName')==database
              and r.get('minimumSupportedDesktopVersion')==min_desktop
              and r.get('latestDesktopVersion')==version
              and valid_mobile_policy('minimumSupportedAndroidVersion','latestAndroidVersion')
              and valid_mobile_policy('minimumSupportedIosVersion','latestIosVersion'))
          if not ok:
              raise SystemExit(f'Public UAT health validation failed: {r}')
          print(f"UAT_DEPLOYMENT_OK version={version} database={database} desktopMin={min_desktop} android={r.get('minimumSupportedAndroidVersion')}..{r.get('latestAndroidVersion')} ios={r.get('minimumSupportedIosVersion')}..{r.get('latestIosVersion')} mobilePolicy=preserved")
          PY
      - name: Verify UAT private GitHub update gateway
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_BASE="${PUBLIC_HEALTH_URL%/api/runtime/health}"
          UPDATE_URL="${UPDATE_BASE}/api/updates/releases/latest?includePrerelease=true"
          BODY="$(curl --fail --silent --show-error --max-time 30 "$UPDATE_URL")"
          python3 - '${{ needs.validate.outputs.version }}' "$BODY" <<'PY'
          import json,sys
          version,body=sys.argv[1:]
          r=json.loads(body)
          tag=str(r.get('tagName','')).lstrip('vV')
          assets=r.get('assets')
          if tag != version:
              raise SystemExit(f'Private update gateway returned unexpected release: {r}')
          if not isinstance(assets,list) or not assets:
              raise SystemExit(f'Private update gateway returned no release assets: {r}')
          for asset in assets:
              url=str(asset.get('downloadUrl',''))
              if not url.startswith('/api/updates/assets/'):
                  raise SystemExit(f'Private update gateway exposed an unexpected asset URL: {asset}')
          print(f'UAT_PRIVATE_UPDATE_GATEWAY_OK version={version} assets={len(assets)}')
          PY
      - name: Clean remote upload staging
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -rf /tmp/dse-erp-ci-deploy' || true
      - name: Upload UAT deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-deployment-${{ needs.validate.outputs.tag }}
          path: DSE-ERP-UAT-deploy.log
          if-no-files-found: ignore
          retention-days: 30

  deploy-prod:
    name: Deploy same release to PROD
    if: github.repository == 'ssdhameliya/DSE-ERP'
    needs: [validate, server, release, deploy-uat]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    concurrency:
      group: dse-erp-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      DSE_GITHUB_UPDATE_TOKEN: ${{ secrets.DSE_GITHUB_UPDATE_TOKEN }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PROD_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      PROD_EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
      UAT_HEALTH_URL: ${{ vars.DSE_UAT_PUBLIC_HEALTH_URL }}
      UAT_EXPECTED_DATABASE: ${{ vars.DSE_UAT_EXPECTED_DATABASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PROD deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DSE_GITHUB_UPDATE_TOKEN PROD_HEALTH_URL PROD_EXPECTED_DATABASE UAT_HEALTH_URL UAT_EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub production environment secret/variable: $name" >&2; exit 1; }
          done
          echo "VERSION=${{ needs.validate.outputs.version }}" >> "$GITHUB_ENV"
          echo "TAG=${{ needs.validate.outputs.tag }}" >> "$GITHUB_ENV"
          echo "COMPATIBILITY_BASELINE=${{ needs.validate.outputs.compatibility_baseline }}" >> "$GITHUB_ENV"
          echo "ANDROID_MINIMUM=${{ needs.validate.outputs.android_minimum }}" >> "$GITHUB_ENV"
          echo "ANDROID_LATEST=${{ needs.validate.outputs.android_latest }}" >> "$GITHUB_ENV"
          echo "IOS_MINIMUM=${{ needs.validate.outputs.ios_minimum }}" >> "$GITHUB_ENV"
          echo "IOS_LATEST=${{ needs.validate.outputs.ios_latest }}" >> "$GITHUB_ENV"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Verify the same version is currently healthy in UAT
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$UAT_HEALTH_URL")"
          python3 - "$VERSION" "$UAT_EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$BODY" <<'PY'
          import json,re,sys
          version,database,min_desktop,body=sys.argv[1:]
          r=json.loads(body)
          semver=re.compile(r'^\d+\.\d+\.\d+$')
          def valid_mobile_policy(min_key, latest_key):
              minimum=r.get(min_key); latest=r.get(latest_key)
              if not isinstance(minimum,str) or not isinstance(latest,str): return False
              if not semver.fullmatch(minimum) or not semver.fullmatch(latest): return False
              parse=lambda x: tuple(map(int,x.split('.')))
              return parse(minimum) <= parse(latest)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='UAT' and r.get('databaseName')==database
              and r.get('minimumSupportedDesktopVersion')==min_desktop
              and r.get('latestDesktopVersion')==version
              and valid_mobile_policy('minimumSupportedAndroidVersion','latestAndroidVersion')
              and valid_mobile_policy('minimumSupportedIosVersion','latestIosVersion'))
          if not ok:
              raise SystemExit(f'UAT is not running the requested release: {r}')
          print(f"UAT_GATE_OK version={version} database={database} desktopMin={min_desktop} android={r.get('minimumSupportedAndroidVersion')}..{r.get('latestAndroidVersion')} ios={r.get('minimumSupportedIosVersion')}..{r.get('latestIosVersion')} mobilePolicy=environment-owned")
          PY

      - name: Download and verify exact GitHub release server artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          gh release download "$TAG" --repo '${{ github.repository }}' \
            --pattern "DSE-ERP-${VERSION}-SERVER.jar" \
            --pattern 'checksums.txt' \
            --dir deploy-artifacts
          JAR="deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar"
          EXPECTED="$(awk -v f="DSE-ERP-${VERSION}-SERVER.jar" '$2==f {print $1}' deploy-artifacts/checksums.txt)"
          [[ -n "$EXPECTED" ]] || { echo 'Server checksum is missing from release checksums.txt' >&2; exit 1; }
          ACTUAL="$(sha256sum "$JAR" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Release server checksum mismatch: $ACTUAL != $EXPECTED" >&2; exit 1; }
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "PROD_ARTIFACT_MATCH_OK sha=$ACTUAL"

      - name: Configure strict SSH host verification
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release and deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${VERSION}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            scripts/linux/configure-github-update-token.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"

      - name: Configure PROD private GitHub update token
        shell: bash
        run: |
          set -euo pipefail
          # Stream the production GitHub Environment secret over SSH stdin.
          # It never appears in command arguments, repository files or logs.
          printf '%s\n' "$DSE_GITHUB_UPDATE_TOKEN" | \
            ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              'bash /tmp/dse-erp-ci-deploy/configure-github-update-token.sh prod'

      - name: Deploy PROD with automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh prod /tmp/dse-erp-ci-deploy/DSE-ERP-${VERSION}-SERVER.jar '${VERSION}' '${{ steps.artifact.outputs.sha }}' '${COMPATIBILITY_BASELINE}' '${ANDROID_MINIMUM}' '${ANDROID_LATEST}' '${IOS_MINIMUM}' '${IOS_LATEST}'" \
            | tee DSE-ERP-PROD-deploy.log

      - name: Verify public PROD HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PROD_HEALTH_URL")"
          python3 - "$VERSION" "$PROD_EXPECTED_DATABASE" "$COMPATIBILITY_BASELINE" "$BODY" <<'PY'
          import json,re,sys
          version,database,min_desktop,body=sys.argv[1:]
          r=json.loads(body)
          semver=re.compile(r'^\d+\.\d+\.\d+$')
          def valid_mobile_policy(min_key, latest_key):
              minimum=r.get(min_key); latest=r.get(latest_key)
              if not isinstance(minimum,str) or not isinstance(latest,str): return False
              if not semver.fullmatch(minimum) or not semver.fullmatch(latest): return False
              parse=lambda x: tuple(map(int,x.split('.')))
              return parse(minimum) <= parse(latest)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='PROD' and r.get('databaseName')==database
              and r.get('minimumSupportedDesktopVersion')==min_desktop
              and r.get('latestDesktopVersion')==version
              and valid_mobile_policy('minimumSupportedAndroidVersion','latestAndroidVersion')
              and valid_mobile_policy('minimumSupportedIosVersion','latestIosVersion'))
          if not ok:
              raise SystemExit(f'Public PROD health validation failed: {r}')
          print(f"PROD_DEPLOYMENT_OK version={version} database={database} desktopMin={min_desktop} android={r.get('minimumSupportedAndroidVersion')}..{r.get('latestAndroidVersion')} ios={r.get('minimumSupportedIosVersion')}..{r.get('latestIosVersion')} mobilePolicy=preserved")
          PY

      - name: Promote health-verified GitHub release to STABLE
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo '${{ github.repository }}' --prerelease=false
          PRERELEASE="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.prerelease')"
          [[ "$PRERELEASE" == "false" ]] || { echo "GitHub release $TAG was not promoted to STABLE" >&2; exit 1; }
          echo "RELEASE_PROMOTED_TO_STABLE tag=$TAG"

      - name: Verify PROD private GitHub update gateway
        id: prod_gateway
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_BASE="${PROD_HEALTH_URL%/api/runtime/health}"
          # PROD intentionally rejects prerelease access. Verify only after promotion,
          # through the stable endpoint that real PROD desktops use.
          UPDATE_URL="${UPDATE_BASE}/api/updates/releases/latest"
          BODY="$(curl --fail --silent --show-error --max-time 30 "$UPDATE_URL")"
          python3 - "$VERSION" "$BODY" <<'PY'
          import json,sys
          version,body=sys.argv[1:]
          r=json.loads(body)
          tag=str(r.get('tagName','')).lstrip('vV')
          assets=r.get('assets')
          if tag != version:
              raise SystemExit(f'Private PROD update gateway returned unexpected stable release: {r}')
          if not isinstance(assets,list) or not assets:
              raise SystemExit(f'Private PROD update gateway returned no release assets: {r}')
          for asset in assets:
              url=str(asset.get('downloadUrl',''))
              if not url.startswith('/api/updates/assets/'):
                  raise SystemExit(f'Private PROD update gateway exposed an unexpected asset URL: {asset}')
          print(f'PROD_PRIVATE_UPDATE_GATEWAY_OK version={version} assets={len(assets)}')
          PY

      - name: Demote release if PROD update gateway verification fails
        if: failure() && steps.promote.outcome == 'success' && steps.prod_gateway.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo '${{ github.repository }}' --prerelease=true
          echo "RELEASE_DEMOTED_TO_PRERELEASE tag=$TAG reason=prod-update-gateway-verification"

      - name: Clean remote upload staging
        if: always() && steps.ssh.outcome == 'success'
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -rf /tmp/dse-erp-ci-deploy' || true

      - name: Upload PROD deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-deployment-${{ needs.validate.outputs.tag }}
          path: DSE-ERP-PROD-deploy.log
          if-no-files-found: ignore
          retention-days: 30

