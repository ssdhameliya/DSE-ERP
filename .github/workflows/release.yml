name: Build Native Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tail -1)"
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          POM_VERSION="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tail -1)"
          if [[ "$VERSION" != "$POM_VERSION" ]]; then
            echo "Tag version $VERSION does not match pom.xml version $POM_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Enforce current release contracts
        run: python3 scripts/audit-release-gates.py
      - name: Run tests
        run: ./mvnw -B -ntp clean verify


  server:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build canonical server artifact
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl server -am package -DskipTests
          mkdir -p release-artifacts/server
          cp server/target/dse-erp-server.jar "release-artifacts/server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
          sha256sum "release-artifacts/server/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
      - name: Upload canonical server artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-release
          path: release-artifacts/server/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify project on Windows
        shell: pwsh
        run: ./mvnw -B -ntp clean verify
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
            if ($wix) { $wixBin = Join-Path $wix.FullName 'bin'; $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
      - name: Prepare PostgreSQL 18 runtime
        shell: pwsh
        run: |
          choco install postgresql18 --yes --no-progress --params '/NoPath /Password:DseReleaseBuildOnly!'
          $pg = 'C:\Program Files\PostgreSQL\18'
          if (-not (Test-Path (Join-Path $pg 'bin\initdb.exe'))) { throw "PostgreSQL 18 runtime not found at $pg" }
          "DSE_POSTGRES_RUNTIME_DIR=$pg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ needs.validate.outputs.version }}'
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release-artifacts/windows/*
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
          cache: maven
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: |
          PG_RUNTIME="$RUNNER_TEMP/dse-postgresql-18.4"
          zsh ./scripts/build-postgresql-macos.sh "$PG_RUNTIME"
          echo "DSE_POSTGRES_RUNTIME_DIR=$PG_RUNTIME" >> "$GITHUB_ENV"
      - name: Validate macOS packaging script
        shell: zsh {0}
        run: zsh -n ./scripts/package-macos.sh
      - name: Verify project on macOS
        shell: zsh {0}
        run: ./mvnw -B -ntp clean verify
      - name: Build macOS Apple Silicon DMG
        shell: zsh {0}
        run: zsh ./scripts/package-macos.sh '${{ needs.validate.outputs.version }}'
      - name: Upload macOS Apple Silicon package
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: target/macos-installer/*
          if-no-files-found: error
          retention-days: 7

  macos-intel:
    needs: validate
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven
      - name: Prepare PostgreSQL 18 runtime
        shell: zsh {0}
        run: |
          PG_RUNTIME="$RUNNER_TEMP/dse-postgresql-18.4"
          zsh ./scripts/build-postgresql-macos.sh "$PG_RUNTIME"
          echo "DSE_POSTGRES_RUNTIME_DIR=$PG_RUNTIME" >> "$GITHUB_ENV"
      - name: Validate macOS packaging script
        shell: zsh {0}
        run: zsh -n ./scripts/package-macos.sh
      - name: Verify project on macOS
        shell: zsh {0}
        run: ./mvnw -B -ntp clean verify
      - name: Build macOS Intel DMG
        shell: zsh {0}
        run: zsh ./scripts/package-macos.sh '${{ needs.validate.outputs.version }}'
      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel
          path: target/macos-installer/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, server, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          rm -f checksums*.txt
          sha256sum DSE-ERP-* > checksums.txt
          ls -lah
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ needs.validate.outputs.tag }}' artifacts/* \
            --repo '${{ github.repository }}' \
            --title 'DSE ERP ${{ needs.validate.outputs.version }}' \
            --generate-notes \
            --prerelease \
            --verify-tag


  deploy-uat:
    name: Auto-deploy release to UAT
    if: github.repository == 'ssdhameliya/DSE-ERP'
    needs: [validate, server, release]
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 25
    env:
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_HEALTH_URL: ${{ vars.DSE_PUBLIC_HEALTH_URL }}
      EXPECTED_DATABASE: ${{ vars.DSE_EXPECTED_DATABASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate UAT deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS PUBLIC_HEALTH_URL EXPECTED_DATABASE; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub uat environment secret/variable: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
      - name: Download canonical server artifact
        uses: actions/download-artifact@v5
        with:
          name: server-release
          path: deploy-artifacts
      - name: Verify server artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="deploy-artifacts/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar"
          [[ -s "$JAR" ]] || { echo "Missing server artifact: $JAR" >&2; exit 1; }
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "UAT server artifact SHA-256: $SHA"
      - name: Configure strict SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_deploy_key
          chmod 600 ~/.ssh/dse_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release and deployment script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-erp-ci-deploy'
          scp -i ~/.ssh/dse_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar" \
            scripts/linux/deploy-oracle-release.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-erp-ci-deploy/"
      - name: Deploy UAT with automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-erp-ci-deploy/deploy-oracle-release.sh uat /tmp/dse-erp-ci-deploy/DSE-ERP-${{ needs.validate.outputs.version }}-SERVER.jar '${{ needs.validate.outputs.version }}' '${{ steps.artifact.outputs.sha }}'" \
            | tee DSE-ERP-UAT-deploy.log
      - name: Verify public UAT HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - '${{ needs.validate.outputs.version }}' "$EXPECTED_DATABASE" "$BODY" <<'PY'
          import json,sys
          version,database,body=sys.argv[1:]
          r=json.loads(body)
          ok=(r.get('ready') is True and r.get('version')==version and r.get('buildRevision')==version
              and r.get('environment')=='UAT' and r.get('databaseName')==database)
          if not ok:
              raise SystemExit(f'Public UAT health validation failed: {r}')
          print(f'UAT_DEPLOYMENT_OK version={version} database={database}')
          PY
      - name: Clean remote upload staging
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/dse_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -rf /tmp/dse-erp-ci-deploy' || true
      - name: Upload UAT deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-deployment-${{ needs.validate.outputs.tag }}
          path: DSE-ERP-UAT-deploy.log
          if-no-files-found: ignore
          retention-days: 30
