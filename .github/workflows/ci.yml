name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
          - name: Windows x64
            os: windows-latest
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            arch: aarch64
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.arch }}
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Enforce no new desktop JDBC debt
        run: python scripts/audit-desktop-jdbc.py
      - name: Enforce Phase 2 desktop data boundary
        run: python scripts/audit-phase2-data-boundary.py
      - name: Enforce PostgreSQL-only desktop runtime
        run: python scripts/audit-postgres-only.py
      - name: Enforce final Spring/Hibernate data architecture
        run: python scripts/audit-final-data-architecture.py
      - name: Enforce auth, shortcut and recon UI contract
        run: python scripts/audit-auth-shortcut-ui-contract.py
      - name: Enforce global register and dialog UI contract
        run: python scripts/audit-global-ui-contract.py
      - name: Enforce 9.0.3 import and history contract
        run: python scripts/audit-9.0.3-import-contract.py
      - name: Enforce 9.0.4 Bank reconciliation contract
        run: python scripts/audit-9.0.4-bank-reconciliation-contract.py
      - name: Enforce 9.0.5 reconciliation/navigation UI contract
        run: python scripts/audit-9.0.5-reconciliation-navigation-ui-contract.py
      - name: Enforce 9.0.6 business-integrity contract
        run: python scripts/audit-9.0.6-business-integrity-contract.py
      - name: Enforce 9.0.8 PDF Studio safety contract
        run: python scripts/audit-9.0.8-pdf-studio-contract.py
      - name: Enforce 9.0.11 consolidated corrective contract
        run: python scripts/audit-9.0.11-corrective-contract.py
      - name: Enforce 9.0.12 Sales/payment compatibility contract
        run: python scripts/audit-9.0.12-sales-payment-compatibility.py
      - name: Enforce 9.0.13 register/KPI/login/history contract
        run: python scripts/audit-9.0.13-register-login-history-contract.py
      - name: Enforce 9.0.14 quotation/register contract
        run: python scripts/audit-9.0.14-quotation-register-contract.py
      - name: Enforce 9.0.15 reference/item/import/quotation-source contract
        run: python scripts/audit-9.0.15-reference-item-import-contract.py
      - name: Enforce 9.0.16 quotation-source / linked-sale contract
        run: python scripts/audit-9.0.16-quotation-source-sale-link-contract.py
      - name: Enforce 9.0.35 engineering hardening contract
        run: python scripts/audit-9.0.35-engineering-hardening.py
      - name: Verify final UI source contract
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('desktop/src/main/resources')
          fxml = sorted((root / 'fxml').rglob('*.fxml'))
          minimum_fxml = 50
          if len(fxml) < minimum_fxml:
              raise SystemExit(f'Expected at least {minimum_fxml} FXML files, found {len(fxml)}')
          for path in fxml:
              ET.parse(path)

          for css_name in ('ui-layout.css', 'ui-components.css', 'light-theme.css', 'dark-theme.css'):
              text = (root / 'css' / css_name).read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces in {css_name}')
              if '-fx-font-weight: 850' in text:
                  raise SystemExit(f'Invalid JavaFX font weight remains in {css_name}')

          responsive = ('platform-macos', 'platform-windows', 'compact-shell', 'ultra-compact-shell', 'small-display', 'compact-layout', 'narrow-shell')
          palette = {'-fx-background-color', '-fx-text-fill', '-fx-border-color', '-fx-fill', '-fx-stroke', '-fx-accent', '-fx-focus-color', '-fx-faint-focus-color'}
          for css_name in ('light-theme.css', 'dark-theme.css'):
              text = (root / 'css' / css_name).read_text(encoding='utf-8')
              for match in re.finditer(r'([^{}]+)\{([^{}]*)\}', text, re.S):
                  selector = re.sub(r'/\*.*?\*/', '', match.group(1), flags=re.S)
                  if not any(marker in selector for marker in responsive):
                      continue
                  for prop in re.findall(r'(-fx-[\w-]+)\s*:', match.group(2)):
                      if prop not in palette:
                          raise SystemExit(f'{css_name}: responsive non-palette property remains: {selector.strip()} -> {prop}')

          platform_support = Path('desktop/src/main/java/org/example/util/PlatformUiSupport.java').read_text(encoding='utf-8')
          for contract in ('width < 1250', '"narrow-shell"', 'width < 1050', '"small-display"'):
              if contract not in platform_support:
                  raise SystemExit(f'Missing responsive contract: {contract}')
          dashboard = Path('desktop/src/main/java/org/example/controller/DashboardController.java').read_text(encoding='utf-8')
          if 'installResponsiveShellSizing' in dashboard:
              raise SystemExit('Dashboard still owns responsive shell sizing')

          shared_css = (root / 'css' / 'ui-layout.css').read_text(encoding='utf-8') + (root / 'css' / 'ui-components.css').read_text(encoding='utf-8')
          for selector in ('.platform-macos .erp-sidebar', '.narrow-shell .erp-sidebar', '.small-display .erp-sidebar', '.platform-macos .erp-global-search', '.compact-shell .erp-global-search'):
              if selector not in shared_css:
                  raise SystemExit(f'Missing responsive CSS selector: {selector}')

          profiles = ((1024, 768), (1280, 720), (1366, 768), (1440, 900), (1512, 982), (1600, 900), (1920, 1080), (2560, 1440))
          for width, height in profiles:
              classes = {
                  'compact-shell': width < 1500 or height < 850,
                  'narrow-shell': width < 1250,
                  'ultra-compact-shell': width < 1220 or height < 720,
                  'small-display': width < 1050 or height < 650,
              }
              active = ','.join(name for name, enabled in classes.items() if enabled) or 'full-size'
              print(f'RESPONSIVE_PROFILE {width}x{height} -> {active}')
          print(f'UI_SOURCE_CONTRACT_OK fxml={len(fxml)} profiles={len(profiles)}')
      - name: Verify project
        run: ./mvnw -B -ntp clean verify

  postgres-integration:
    name: PostgreSQL workflow integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dse_erp_it
          POSTGRES_USER: dse_it
          POSTGRES_PASSWORD: dse_it_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U dse_it -d dse_erp_it"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DSE_IT_DB_URL: jdbc:postgresql://127.0.0.1:55432/dse_erp_it
      DSE_IT_DB_USERNAME: dse_it
      DSE_IT_DB_PASSWORD: dse_it_password
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure Maven wrapper is executable
        shell: bash
        run: chmod +x mvnw
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run PostgreSQL lifecycle integration
        run: ./mvnw -B -ntp -pl server -am test -Dtest=PostgresWorkflowIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false
