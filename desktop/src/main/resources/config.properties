# Application update system defaults. Users can change these in Settings.
app.version=${project.version}
update.github.owner=ssdhameliya
update.github.repository=DSE-ERP
update.channel=STABLE
update.checkAtStartup=true
update.downloadInBackground=false
# PostgreSQL runtime. Fresh workspaces use DSE ERP managed PostgreSQL; explicit db.url/DSE_DB_URL remains external.
runtime.postgres.mode=managed
runtime.postgres.stopOnExit=false
db.url=jdbc:postgresql://localhost:5432/dse_erp
db.username=dse_erp_app
# Authentication and business data are always served by the local Spring backend.
auth.api.baseUrl=http://127.0.0.1:8080

# Phase 2 master-data API
data.api.baseUrl=http://127.0.0.1:8080
