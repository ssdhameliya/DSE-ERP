spring.application.name=dse-erp-server
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=${DSE_SERVER_PORT:8080}
# Local mode remains loopback-only. A designated company server explicitly sets
# DSE_SERVER_ADDRESS=0.0.0.0 (or a specific LAN interface) and is protected by its firewall/TLS proxy.
server.address=${DSE_SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DSE_DB_URL:jdbc:postgresql://localhost:5432/dse_erp}
spring.datasource.username=${DSE_DB_USERNAME:dse_erp_app}
spring.datasource.password=${DSE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# Keep the local/server pool resilient across PostgreSQL restarts and idle network expiry.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V5_1_2__server_owned_schema.sql
spring.sql.init.continue-on-error=false
dse.app.version=9.0.28
dse.api.revision=spring-security-bearer-v5
dse.build.revision=9.0.28
dse.smtp.host=${DSE_SMTP_HOST:}
dse.smtp.port=${DSE_SMTP_PORT:587}
dse.smtp.email=${DSE_SMTP_EMAIL:}
dse.smtp.password=${DSE_SMTP_PASSWORD:}
dse.smtp.config-file=${DSE_SMTP_CONFIG_FILE:}

# Per-launch secret protecting the localhost-only compatibility bridge.
dse.internal.bridge-token=${DSE_INTERNAL_BRIDGE_TOKEN:}

dse.workspace.path=${DSE_WORKSPACE_PATH:}
dse.postgres.home=${DSE_POSTGRES_HOME:}
dse.backup.enabled=${DSE_SERVER_BACKUP_ENABLED:false}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Return settlement due period after Admin approval (server-owned lifecycle policy)
dse.return.settlement-days=7
