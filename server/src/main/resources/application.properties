spring.application.name=dse-erp-server
server.port=${DSE_SERVER_PORT:8080}
spring.datasource.url=${DSE_DB_URL:jdbc:postgresql://localhost:5432/dse_erp}
spring.datasource.username=${DSE_DB_USERNAME:dse_erp_app}
spring.datasource.password=${DSE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
dse.app.version=5.0.6
dse.api.revision=bank-reconciliation-v1
